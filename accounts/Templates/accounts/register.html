{% extends "base.html" %}

{% block title %}
Register - MMAMC
{% endblock %}

{% block content %}

<div class="login-container">

    <div class="login-box">

        <h2>Create Account</h2>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <input
                type="text"
                name="username"
                placeholder="Username"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Password"
                required
            >

            <input
                type="password"
                name="confirm_password"
                placeholder="Confirm Password"
                required
            >

            <button type="submit">
                Register
            </button>

        </form>

        <p>
            Already have an account?
            <a href="{% url 'accounts:login' %}">
                Sign In
            </a>
        </p>

    </div>

</div>

{% endblock %}
